<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="optionsTitle">Agent Browser Bridge options</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section id="connection" data-state="disconnected">
        <strong id="status-text" data-i18n="statusChecking">Checking connection…</strong>
        <ul id="agents" class="agents" hidden></ul>
      </section>
      <section id="instance-setting">
        <label for="instance-name"><strong data-i18n="instanceNameLabel">Name this browser profile</strong></label>
        <input id="instance-name" type="text" placeholder="For example Work or Personal" data-i18n-placeholder="instanceNamePlaceholder" autocomplete="off" spellcheck="false" />
        <span class="hint" data-i18n="optionsInstanceNameHint">Agents use this name to tell your browsers and profiles apart. <span id="instance-id"></span></span>
      </section>
      <section id="analytics-setting">
        <label class="toggle">
          <input type="checkbox" id="analytics-enabled" />
          <span>
            <strong data-i18n="analyticsTitle">Share anonymous usage statistics</strong>
            <span class="hint" data-i18n="analyticsHint">
              Which features are used, whether they succeed, and the extension and agent versions. Never tab titles, URLs or page contents.
              <a id="privacy-link" target="_blank" rel="noopener" data-i18n="privacyPolicy">Privacy policy</a>
            </span>
          </span>
        </label>
      </section>
      <p id="analytics-unavailable" class="hint" data-i18n="analyticsUnavailable" hidden>This build does not collect usage statistics.</p>
      <p><a id="setup-link" href="../welcome/index.html" target="_blank" data-i18n="openSetup">Open setup and connection status</a></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
