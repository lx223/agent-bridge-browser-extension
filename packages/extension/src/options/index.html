<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Browser Bridge options</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section id="connection" data-state="disconnected">
        <strong id="status-text">Checking connection…</strong>
        <ul id="agents" class="agents" hidden></ul>
      </section>
      <section id="analytics-setting">
        <label class="toggle">
          <input type="checkbox" id="analytics-enabled" />
          <span>
            <strong>Share anonymous usage statistics</strong>
            <span class="hint">
              Which features are used, whether they succeed, and the extension and agent versions. Never tab titles, URLs or page contents.
              <a id="privacy-link" target="_blank" rel="noopener">Privacy policy</a>
            </span>
          </span>
        </label>
      </section>
      <p id="analytics-unavailable" class="hint" hidden>This build does not collect usage statistics.</p>
      <p><a id="setup-link" href="../welcome/index.html" target="_blank">Open setup and connection status</a></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
