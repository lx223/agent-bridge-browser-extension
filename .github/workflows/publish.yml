name: Publish Release

# Manually triggered. Releases the extension zip to GitHub using the version in
# extensions/browser/package.json, together with the Claude Desktop extension
# bundle. The MCP server is published to npm by publish-npm.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Read versions
        id: version
        run: |
          EXT=$(node -p "require('./extensions/browser/package.json').version")
          SRV=$(node -p "require('./packages/server/package.json').version")
          echo "extension=$EXT" >> "$GITHUB_OUTPUT"
          echo "server=$SRV" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$EXT" >/dev/null; then
            echo "Tag v$EXT already exists; bump extensions/browser/package.json" && exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_POSTHOG_KEY: phc_FtV2hwQzJhR4Ul4ts9ViUxKZIP9MlDPMjMyvvPfZFjg
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_UNINSTALL_SURVEY_URL: https://eu.posthogsurveys.com/external_surveys/01a1eb02-9bf0-0000-54ae-59e3f95e3984

      - name: Pack Claude Desktop extension
        run: npm run pack:mcpb -w agent-browser-bridge-mcp -- "$GITHUB_WORKSPACE/agent-browser-bridge.mcpb"

      - name: Zip extension
        run: cp LICENSE extensions/browser/dist/ && cd extensions/browser/dist && zip -r "$GITHUB_WORKSPACE/agent-browser-bridge-${{ steps.version.outputs.extension }}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.extension }}
          name: Release v${{ steps.version.outputs.extension }}
          files: |
            agent-browser-bridge-${{ steps.version.outputs.extension }}.zip
            agent-browser-bridge.mcpb
          generate_release_notes: true
