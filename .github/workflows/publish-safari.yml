name: Publish Safari App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:safari-app -w agent-browser-bridge-extension

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: printf '%s' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/app-store-connect.p8"

      - name: Archive and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/app-store-connect.p8
          VITE_POSTHOG_KEY: phc_FtV2hwQzJhR4Ul4ts9ViUxKZIP9MlDPMjMyvvPfZFjg
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_UNINSTALL_SURVEY_URL: https://eu.posthogsurveys.com/external_surveys/01a1eb02-9bf0-0000-54ae-59e3f95e3984
        run: npm run release:safari -w agent-browser-bridge-extension -- --build-number "${{ github.run_number }}"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/app-store-connect.p8"
