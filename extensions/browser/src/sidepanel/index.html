<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="chatTitle">Agent chat</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="heading">
        <strong id="title" data-i18n="chatTitle">Agent chat</strong>
        <div id="picker" class="picker" hidden>
          <select id="conversation" aria-label="Conversation" data-i18n-aria-label="chatConversation"></select>
        </div>
        <span id="status" class="status"></span>
      </div>
      <button type="button" id="end" class="quiet" data-i18n="chatEnd" hidden>End chat</button>
      <button type="button" id="remove" class="quiet" data-i18n="chatRemove" hidden>Remove</button>
      <a id="setup-link" class="icon-button" href="../welcome/index.html" target="_blank" title="Setup" aria-label="Setup" data-i18n-title="chatSetup" data-i18n-aria-label="chatSetup">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path d="M8.6 2.5h2.8l.4 2.1 1.5.9 2-.8 1.4 2.4-1.6 1.4v1.7l1.6 1.4-1.4 2.4-2-.8-1.5.9-.4 2.1H8.6l-.4-2.1-1.5-.9-2 .8-1.4-2.4 1.6-1.4V8.5L3.3 7.1l1.4-2.4 2 .8 1.5-.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          <circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </a>
    </header>
    <section id="empty" class="empty">
      <svg class="empty-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
        <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.4c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </svg>
      <h1 data-i18n="chatEmptyHeading">Talk to your agent from here</h1>
      <p data-i18n="chatEmptyBody">Ask your agent to continue in the browser, or run its <code>continue_in_browser</code> prompt. Its messages appear here, and your replies go straight back to it.</p>
      <p class="hint" data-i18n="chatEmptyHint">Each agent session gets its own conversation.</p>
    </section>
    <ol id="messages" aria-live="polite" hidden></ol>
    <form id="composer" hidden>
      <div id="field" class="field">
        <textarea id="input" rows="1" placeholder="Message the agent" aria-label="Message the agent" data-i18n-placeholder="chatInput" data-i18n-aria-label="chatInput"></textarea>
        <button type="submit" id="send" class="send" title="Send" aria-label="Send" data-i18n-title="chatSend" data-i18n-aria-label="chatSend" disabled>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <p id="composer-hint" class="hint"></p>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
